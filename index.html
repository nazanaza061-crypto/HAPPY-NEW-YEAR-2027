<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Happy New Year 2027</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="welcome" class="welcome">
      <div class="welcome-stars"></div>
      <div class="welcome-content">
        <p class="eyebrow">A NEW BEGINNING</p>
        <h1>NEW YEAR</h1>
        <div class="welcome-year">2027</div>
        <button id="enterButton" type="button">PRESS ENTER <span>↗</span></button>
        <p class="hint">PRESS ENTER TO BEGIN</p>
      </div>
    </section>

    <section id="celebration" class="celebration" aria-hidden="true">
      <canvas id="fireworks"></canvas>
      <div class="skyline" aria-hidden="true">
        <div class="city-glow"></div>
        <div class="buildings" id="buildings"></div>
        <div class="water"></div>
      </div>
      <div class="greeting" id="greeting">
        <p class="greeting-kicker">LET THE CELEBRATION BEGIN</p>
        <h2>HAPPY NEW YEAR</h2>
        <div class="greeting-year">2027</div>
        <p class="greeting-sub">WISHING YOU A BRIGHTER FUTURE</p>
      </div>
      <div class="finale-label" id="finaleLabel">A NIGHT TO REMEMBER</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
